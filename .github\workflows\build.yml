name: Build Windows app

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SINGBOX_SERIES: "1.12"        # sing-box minor series used by the generated config
  WINTUN_VERSION: "0.14.1"
  OPENVPN_CANDIDATES: "2.6.14-I001 2.6.13-I001 2.6.12-I001 2.6.11-I001 2.6.10-I001"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish src/MehrVpn.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Get-ChildItem publish

      - name: Download sing-box
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh api repos/SagerNet/sing-box/releases --paginate --jq '.[] | select(.prerelease==false) | .tag_name'
          $tag = $tags | Where-Object { $_ -like "v$($env:SINGBOX_SERIES).*" } | Select-Object -First 1
          if (-not $tag) { throw "no sing-box release found for series $($env:SINGBOX_SERIES)" }
          Write-Host "sing-box tag: $tag"
          New-Item -ItemType Directory -Force -Path tmp-sb | Out-Null
          gh release download $tag -R SagerNet/sing-box -p "sing-box-*-windows-amd64.zip" -D tmp-sb
          $zip = Get-ChildItem tmp-sb -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "sing-box zip not downloaded" }
          Expand-Archive $zip.FullName -DestinationPath tmp-sb/x -Force
          $exe = Get-ChildItem tmp-sb/x -Recurse -Filter sing-box.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path publish/deps/singbox | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" publish/deps/singbox -Recurse -Force
          Set-Content -Path publish/deps/singbox/VERSION.txt -Value $tag

      - name: Download Wintun driver DLL
        shell: pwsh
        run: |
          $url = "https://www.wintun.net/builds/wintun-$($env:WINTUN_VERSION).zip"
          Invoke-WebRequest -Uri $url -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-x -Force
          $dll = Get-ChildItem wintun-x -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if (-not $dll) { throw "wintun.dll (amd64) not found" }
          Copy-Item $dll.FullName publish/deps/singbox/wintun.dll -Force

      - name: Download OpenVPN installer (optional)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path publish/deps/openvpn | Out-Null
          $ok = $false
          foreach ($v in $env:OPENVPN_CANDIDATES.Split(' ')) {
            $url = "https://swupdate.openvpn.org/community/releases/OpenVPN-$v-amd64.msi"
            try {
              Invoke-WebRequest -Uri $url -OutFile publish/deps/openvpn/openvpn.msi -ErrorAction Stop
              if ((Get-Item publish/deps/openvpn/openvpn.msi).Length -gt 1000000) {
                Write-Host "downloaded OpenVPN $v"
                $ok = $true
                break
              }
            } catch {
              Write-Host "not available: $url"
            }
          }
          if (-not $ok) {
            Remove-Item publish/deps/openvpn/openvpn.msi -ErrorAction SilentlyContinue
            Write-Warning "OpenVPN MSI not bundled. Install OpenVPN Community manually."
          }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath MehrVpn-win-x64.zip -Force
          Get-Item MehrVpn-win-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MehrVpn-win-x64
          path: MehrVpn-win-x64.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MehrVpn-win-x64.zip
